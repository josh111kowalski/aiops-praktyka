name: CI Kantyna

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions: write-all

concurrency:
  group: ci-${{ github.ref }}
  # PR: przerywamy stare przebiegi; main: nie przerywamy wdrożenia w połowie
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-central-1
  EKS_CLUSTER: aiops

jobs:
  test-orders-api:
    name: Testy orders-api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/orders-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: app/orders-api/uv.lock

      - name: Zależności
        run: uv sync --locked

      - name: pytest
        run: uv run pytest -q

  test-payments:
    name: Testy payments
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/payments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v4
        with:
          go-version-file: app/payments/go.mod
          cache-dependency-path: app/payments/go.sum

      - name: go test
        run: go test ./...

  build:
    name: Build ${{ matrix.service }}
    needs: [test-orders-api, test-payments]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        service: [orders-api, payments, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_VARIANT=stable
          tags: ${{ vars.ECR_REGISTRY }}/kantyna/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Deploy na namespace
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      REGISTRY: ${{ vars.ECR_REGISTRY }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.2

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: helm upgrade
        run: |
          helm upgrade kantyna app/deploy/helm/kantyna \
            --namespace "$NAMESPACE" \
            --reuse-values \
            --force-conflicts \
            --set "global.imageRegistry=$REGISTRY" \
            --set "global.imageTag=$TAG"

      - name: rollout status
        run: |
          for svc in orders-api payments worker web; do
            kubectl rollout status "deploy/kantyna-$svc" -n "$NAMESPACE" --timeout=5m
          done

      - name: Smoke test /healthz z wnętrza klastra
        run: |
          kubectl run "smoke-${TAG:0:7}" -n "$NAMESPACE" --rm -i --restart=Never \
            --image=curlimages/curl:8.23.0 --command -- sh -c '
              curl -fsS --retry 5 --retry-connrefused http://kantyna-orders-api:8000/healthz &&
              curl -fsS --retry 5 --retry-connrefused http://kantyna-payments:8080/healthz'
